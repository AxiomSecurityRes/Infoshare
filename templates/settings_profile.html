{% extends "base.html" %}
{% block title %}프로필 설정{% endblock %}
{% block content %}
<div class="page-container narrow">
  <h1 class="page-title">⚙ 프로필 설정</h1>
  <form method="POST" class="form-card">
    <div class="form-group">
      <label class="form-label">아이디</label>
      <input type="text" class="form-input" value="{{ user.username }}" disabled>
    </div>
    <div class="form-group">
      <label class="form-label">이메일</label>
      <input type="email" class="form-input" value="{{ user.email }}" disabled>
    </div>
    <div class="form-group">
      <label class="form-label">자기소개</label>
      <textarea name="bio" class="form-textarea" rows="4" maxlength="300"
                placeholder="300자 이내로 입력하세요">{{ user.bio }}</textarea>
    </div>
    <hr class="form-divider">
    <h3 class="form-section-title">비밀번호 변경 (선택)</h3>
    <div class="form-group">
      <label class="form-label">현재 비밀번호</label>
      <input type="password" name="current_password" class="form-input" placeholder="현재 비밀번호">
    </div>
    <div class="form-group">
      <label class="form-label">새 비밀번호</label>
      <input type="password" name="new_password" class="form-input"
             placeholder="변경할 비밀번호 (비워두면 변경 안 함)">
    </div>
    <button type="submit" class="btn btn-primary">저장</button>
  </form>
</div>
{% endblock %}
