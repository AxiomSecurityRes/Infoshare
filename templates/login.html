{% extends "base.html" %}
{% block title %}로그인 — 정보 공유 마당{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="brand-symbol lg">◈</span>
      <h1>정보 공유 마당</h1>
    </div>
    <h2 class="auth-title">로그인</h2>

    <form method="POST" class="auth-form">
      <div class="form-group">
        <label class="form-label">아이디 또는 이메일</label>
        <input type="text" name="login_id" class="form-input"
               placeholder="아이디 또는 이메일 입력" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호</label>
        <div class="pw-wrap">
          <input type="password" name="password" id="pw-field" class="form-input"
                 placeholder="비밀번호 입력" required>
          <button type="button" class="pw-toggle" onclick="togglePw('pw-field', this)">👁</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-full btn-lg">로그인</button>
    </form>

    <div class="auth-footer">
      <p>계정이 없으신가요? <a href="{{ url_for('register') }}">회원가입</a></p>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function togglePw(id, btn) {
  const f = document.getElementById(id);
  if (f.type === 'password') { f.type = 'text'; btn.textContent = '🙈'; }
  else { f.type = 'password'; btn.textContent = '👁'; }
}
</script>
{% endblock %}
