{% extends "base.html" %}
{% block title %}회원가입 — 정보 공유 마당{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card wide">
    <div class="auth-logo">
      <span class="brand-symbol lg">◈</span>
      <h1>정보 공유 마당</h1>
    </div>
    <h2 class="auth-title">회원가입</h2>

    <form method="POST" class="auth-form" id="reg-form">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">아이디 <span class="req">*</span></label>
          <input type="text" name="username" class="form-input"
                 placeholder="2~20자, 영문/숫자/한글/밑줄" required
                 minlength="2" maxlength="20" autofocus>
        </div>
        <div class="form-group">
          <label class="form-label">이메일 <span class="req">*</span></label>
          <input type="email" name="email" class="form-input"
                 placeholder="example@domain.com" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">비밀번호 <span class="req">*</span></label>
          <div class="pw-wrap">
            <input type="password" name="password" id="pw1" class="form-input"
                   placeholder="8자 이상, 대/소문자+숫자+특수문자" required oninput="checkStrength(this.value)">
            <button type="button" class="pw-toggle" onclick="togglePw('pw1', this)">👁</button>
          </div>
          <div class="strength-bar">
            <div id="strength-fill" class="strength-fill"></div>
          </div>
          <small id="strength-msg" class="strength-msg"></small>
        </div>
        <div class="form-group">
          <label class="form-label">비밀번호 확인 <span class="req">*</span></label>
          <div class="pw-wrap">
            <input type="password" name="password2" id="pw2" class="form-input"
                   placeholder="비밀번호 재입력" required oninput="checkMatch()">
            <button type="button" class="pw-toggle" onclick="togglePw('pw2', this)">👁</button>
          </div>
          <small id="match-msg" class="match-msg"></small>
        </div>
      </div>

      <div class="form-group">
        <label class="form-check">
          <input type="checkbox" required>
          <span>이용 약관 및 개인정보 처리 방침에 동의합니다.</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-full btn-lg">가입하기</button>
    </form>

    <div class="auth-footer">
      <p>이미 계정이 있으신가요? <a href="{{ url_for('login') }}">로그인</a></p>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function togglePw(id, btn) {
  const f = document.getElementById(id);
  if (f.type === 'password') { f.type = 'text'; btn.textContent = '🙈'; }
  else { f.type = 'password'; btn.textContent = '👁'; }
}
function checkStrength(pw) {
  let score = 0;
  const msgs = [];
  if (pw.length >= 8) score++; else msgs.push('8자 이상');
  if (/[A-Z]/.test(pw)) score++; else msgs.push('대문자');
  if (/[a-z]/.test(pw)) score++; else msgs.push('소문자');
  if (/\d/.test(pw)) score++; else msgs.push('숫자');
  if (/[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>/?]/.test(pw)) score++; else msgs.push('특수문자');

  const fill = document.getElementById('strength-fill');
  const msg  = document.getElementById('strength-msg');
  const colors = ['', '#ef4444', '#f97316', '#eab308', '#22c55e', '#16a34a'];
  const labels = ['', '매우 약함', '약함', '보통', '강함', '매우 강함'];
  fill.style.width = (score * 20) + '%';
  fill.style.background = colors[score];
  if (msgs.length > 0 && pw.length > 0)
    msg.textContent = '필요: ' + msgs.join(', ');
  else
    msg.textContent = score >= 4 ? '✓ ' + labels[score] : '';
  msg.style.color = colors[score];
}
function checkMatch() {
  const pw1 = document.getElementById('pw1').value;
  const pw2 = document.getElementById('pw2').value;
  const msg = document.getElementById('match-msg');
  if (pw2.length === 0) { msg.textContent = ''; return; }
  if (pw1 === pw2) { msg.textContent = '✓ 일치합니다'; msg.style.color = '#22c55e'; }
  else { msg.textContent = '✗ 일치하지 않습니다'; msg.style.color = '#ef4444'; }
}
</script>
{% endblock %}
